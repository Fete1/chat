<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Afaan Oromoo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #1a1b1e;
            --secondary-dark: #27282b;
            --accent-blue: #2d7fff;
            --text-primary-dark: #ffffff;
            --text-secondary-dark: #a1a1aa;
            --primary-light: #ffffff;
            --secondary-light: #f4f4f5;
            --text-primary-light: #18181b;
            --text-secondary-light: #71717a;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        .dark-theme {
            --bg-primary: var(--primary-dark);
            --bg-secondary: var(--secondary-dark);
            --text-primary: var(--text-primary-dark);
            --text-secondary: var(--text-secondary-dark);
            --border-color: #3f3f46;
        }

        .light-theme {
            --bg-primary: var(--primary-light);
            --bg-secondary: var(--secondary-light);
            --text-primary: var(--text-primary-light);
            --text-secondary: var(--text-secondary-light);
            --border-color: #e4e4e7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .theme-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .chat-container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 900px;
            margin: 1.5rem auto;
            padding: 1.5rem;
            border-radius: 0.75rem;
            animation: fadeIn 0.3s ease;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .message-content {
            line-height: 1.6;
            color: var(--text-primary);
        }

        .user-message {
            background: var(--bg-primary);
        }

        .bot-message {
            background: var(--bg-secondary);
        }

        .input-container {
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            background: var(--bg-primary);
        }

        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        #user-input {
            width: 100%;
            padding: 1rem;
            padding-right: 4rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            color: var(--text-primary);
            font-size: 1rem;
            resize: none;
            min-height: 60px;
            max-height: 200px;
            overflow-y: auto;
        }

        #user-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .send-button {
            position: absolute;
            right: 0.75rem;
            bottom: 0.75rem;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            transition: background-color 0.2s;
        }

        .send-button:hover {
            background: #2266cc;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Code block styling */
        .code-block {
            background: #1e1e1e;
            border-radius: 0.5rem;
            padding: 1rem;
            margin: 1rem 0;
            position: relative;
        }

        .code-block pre {
            color: #d4d4d4;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            overflow-x: auto;
        }

        .copy-button {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.75rem;
        }

        @media (max-width: 768px) {
            .chat-container {
                padding: 0;
            }

            .message {
                margin: 1rem 0;
                padding: 1rem;
            }

            .input-container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body class="dark-theme">
    <button class="theme-toggle" onclick="toggleTheme()">
        <span class="theme-icon">🌙</span>
        <span class="theme-text">Dark Mode</span>
    </button>

    <div class="chat-container">
        <header class="chat-header">
            <h1>🤖 Chatbot Afaan Oromoo</h1>
        </header>
        
        <div class="chat-history" id="chat-history"></div>
        
        <div class="input-container">
            <div class="input-wrapper">
                <textarea 
                    id="user-input" 
                    placeholder="Barruu Oromoo galchaa..."
                    rows="1"
                    aria-label="User input"></textarea>
                <button class="send-button" onclick="sendMessage()">
                    <span>📤</span>
                    Ergaa
                </button>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.querySelector('.theme-icon');
            const themeText = document.querySelector('.theme-text');
            
            if (body.classList.contains('dark-theme')) {
                body.classList.remove('dark-theme');
                body.classList.add('light-theme');
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light Mode';
            } else {
                body.classList.remove('light-theme');
                body.classList.add('dark-theme');
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark Mode';
            }
        }

        function createMessageElement(message, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            
            const header = document.createElement('div');
            header.className = 'message-header';
            header.innerHTML = `
                <span>${isUser ? '👤 Ati' : '🤖 Chatbot'}</span>
            `;
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.innerHTML = message;
            
            messageDiv.appendChild(header);
            messageDiv.appendChild(content);
            return messageDiv;
        }

        function displayMessage(message, isUser) {
            const chatHistory = document.getElementById('chat-history');
            const messageElement = createMessageElement(message, isUser);
            chatHistory.appendChild(messageElement);
            chatHistory.scrollTo({
                top: chatHistory.scrollHeight,
                behavior: 'smooth'
            });
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            input.value = '';
            displayMessage(message, true);

            try {
                const response = await fetch('/api/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: `message=${encodeURIComponent(message)}`
                });

                if (!response.ok) throw new Error('Sirriin hin dandeenye');
                
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                
                displayMessage(data.response || data.english_response, false);
            } catch (error) {
                displayMessage(`❌ ${error.message}`, false);
            }
        }

        // Auto-resize textarea
        const textarea = document.getElementById('user-input');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Enter key support (Shift + Enter for new line)
        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
